<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Fake by Freetown | Authentically Fake Streetwear</title>
    <meta name="description" content="We put 'Fake' on the label so you'd never have to question what's real. Every product. Every size. S to 10XL. One price. One quality. Zero fine print. Streetwear and business apparel from Kuala Lumpur." />
    <meta name="keywords" content="Fake by Freetown, streetwear, apparel, plus size clothing, inclusive sizing, Malaysian fashion, S to 10XL, business wear, casual wear, women's clothing" />
    <meta name="author" content="Fake by Freetown" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://fakebyfreetown.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fake by Freetown | Authentically Fake Streetwear" />
    <meta property="og:description" content="We put 'Fake' on the label so you'd never have to question what's real. Every product. Every size. One price. One quality. Zero fine print." />
    <meta property="og:site_name" content="Fake by Freetown" />
    <meta property="og:locale" content="en_MY" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fake by Freetown | Authentically Fake Streetwear" />
    <meta name="twitter:description" content="Streetwear that means it. S to 10XL. Same quality. Same price. Zero fine print." />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#DC2626" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,500;1,600&family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Fake by Freetown",
      "url": "https://fakebyfreetown.com",
      "description": "Authentically Fake streetwear and business apparel. S to 10XL. One price. One quality. Zero fine print.",
      "foundingLocation": {
        "@type": "Place",
        "name": "Kuala Lumpur, Malaysia"
      },
      "sameAs": []
    }
    </script>

    <!-- Structured Data: WebSite (for sitelinks search) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Fake by Freetown",
      "url": "https://fakebyfreetown.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://fakebyfreetown.com/shop?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data: Store -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ClothingStore",
      "name": "Fake by Freetown",
      "url": "https://fakebyfreetown.com",
      "priceRange": "RM 29 - RM 199",
      "currenciesAccepted": "MYR",
      "paymentAccepted": "Credit Card, Debit Card",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Kuala Lumpur",
        "addressCountry": "MY"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
